<!DOCTYPE html>
<html lang="en">

<head>
    <title>Room Booking - Snehal's HomeStay</title>
</head>

<body>
    <h1>
        <a href="./../Pages/Stay.html"><img src="../img/left-arrow.png" alt="Left Arrow" height="30px" /></a>
        Book Your Stay at Snehal's HomeStay
    </h1>
    <table>
        <tr>
            <td>
                <img src="./../img/booking.png" alt="Booking Image" height="400px" />
            </td>
            <td>
                <form><br /><br />
                    <label>Full Name:</label>
                    <input type="text" placeholder="Enter your name" /><br /><br />
                    <label>Email:</label>
                    <input type="email" placeholder="Enter your email" /><br /><br />
                    <label>Phone Number:</label>
                    <input type="tel" placeholder="Enter your phone number" /><br /><br />
                    <label>Check In:</label>
                    <input type="date" placeholder="Check In Date" /><br /><br />
                    <label>Check Out:</label>
                    <input type="date" placeholder="Check Out Date" /><br /><br />
                    <label>Total Guests:</label>
                    <input type="number" placeholder="Number of Guests" value="1" /><br /><br />
                    <label>City</label>
                    <input type="text" placeholder="Enter your city" /><br /><br />
                    <a href="./booking-done.html"><button>Book Now</button></a><br /><br />
                </form>
            </td>
        </tr>
    </table>
